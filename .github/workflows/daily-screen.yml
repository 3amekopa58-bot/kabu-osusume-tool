name: 株おすすめ通知

on:
  schedule:
    # ⚠️ 2026-09-28: 以前は '0 23'（JST 8:00）にしていたが、GitHub Actions の
    #    スケジュールは予定時刻を保証せず、実測で**中央値120分・最大143分**
    #    遅れていた（到着 JST 9:35〜10:23）。東証の寄り付き9:00より後に届き、
    #    前日終値ベースの推奨価格がずれる状態だった（4.4-79）。
    #    遅延を見込んで前倒しし、分も毎時0分（最も混む枠）を避ける。
    #    UTC 20:43 = JST 5:43 → 実測の遅延95〜143分で JST 7:18〜8:06 に到着。
    #    日〜木で指定するのは、+9時間して月〜金の朝になるため。
    - cron: '43 20 * * 0-4'
  workflow_dispatch: {}

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    # 944銘柄に広げた分だけ実行が長くなる（ローカルで約1分、CIはキャッシュが
    # 空なので株価の初回ダウンロードぶん余計にかかる）。ハングして課金され
    # 続けないよう上限を切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screening
        run: python3 screen.py

      - name: Send notification
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py

      # 推奨結果を残す。これが無いと「その日に何を推奨したか」の記録が
      # ジョブ終了とともに消え、後から実運用の成績を検証できない
      # （output/ はgitignoreされているのでコミットもされない）。
      # 90日保持。実測の勝率・期待値を出すにはこの記録が要る
      - name: Save recommendations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendations-${{ github.run_id }}
          path: output/recommend_*.csv
          # ⚠️ 2026-09-28: 90日だったため、蓄積開始(9/4)分が実運用照合の
          #    予定(2026-12)と同時期に消える状態だった（4.4-78）。
          #    GitHubの上限90日なので、これ以上は延ばせない。
          #    **アーティファクトだけに頼らず data/live_picks/ に取り込む**。
          retention-days: 90
          if-no-files-found: warn
