name: 株おすすめ通知

on:
  schedule:
    - cron: '0 23 * * 0-4'  # UTC 23:00 日〜木 = JST 8:00 月〜金
  workflow_dispatch: {}

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    # 944銘柄に広げた分だけ実行が長くなる（ローカルで約1分、CIはキャッシュが
    # 空なので株価の初回ダウンロードぶん余計にかかる）。ハングして課金され
    # 続けないよう上限を切る
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screening
        run: python3 screen.py

      - name: Send notification
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/notify.py

      # 推奨結果を残す。これが無いと「その日に何を推奨したか」の記録が
      # ジョブ終了とともに消え、後から実運用の成績を検証できない
      # （output/ はgitignoreされているのでコミットもされない）。
      # 90日保持。実測の勝率・期待値を出すにはこの記録が要る
      - name: Save recommendations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendations-${{ github.run_id }}
          path: output/recommend_*.csv
          retention-days: 90
          if-no-files-found: warn
